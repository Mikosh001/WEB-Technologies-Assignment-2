<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery | Advanced CSS Assignment</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">Layout Lab</a>
        <nav class="site-nav" aria-label="Main navigation">
          <ul class="nav-links">
            <li><a href="index.html">Cards</a></li>
            <li><a href="grid-layout.html">Grid Layout</a></li>
            <li><a href="gallery.html" aria-current="page">Gallery</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container page-main">
      <div class="page-heading">
        <p class="eyebrow">Task 3 · Grid System</p>
        <h1>Aktau &amp; Mangystau</h1>
        <p>Nine photographs of my home region in Kazakhstan. Hover over or focus an image to see its caption.</p>
      </div>

      <section class="gallery-grid" aria-label="Photo gallery">
        <figure class="gallery-item" id="photo-1" tabindex="0">
          <img src="images/gallery-1.jpg" alt="Sun setting over the Caspian Sea in Aktau">
          <figcaption>Aktau Sunset</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-2" tabindex="0">
          <img src="images/gallery-2.jpg" alt="Ship monument on the Caspian waterfront in Aktau">
          <figcaption>Aktau Waterfront</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-3" tabindex="0">
          <img src="images/gallery-3.jpg" alt="Pedestrian promenade beside the Caspian Sea in Aktau">
          <figcaption>Aktau Promenade</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-4" tabindex="0">
          <img src="images/gallery-4.jpg" alt="White rock formations in Bozzhyra Valley, Mangystau">
          <figcaption>Bozzhyra Valley</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-5" tabindex="0">
          <img src="images/gallery-5.jpg" alt="Sherkala Mountain in Mangystau">
          <figcaption>Sherkala Mountain</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-6" tabindex="0">
          <img src="images/gallery-6.jpg" alt="Airakty Mountain in Mangystau">
          <figcaption>Airakty Mountain</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-7" tabindex="0">
          <img src="images/gallery-7.jpg" alt="Aktau buildings and lighthouse viewed from the Caspian Sea">
          <figcaption>Aktau Lighthouse</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-8" tabindex="0">
          <img src="images/gallery-8.jpg" alt="Caspian Sea coast near Aktau in Mangystau">
          <figcaption>Caspian Coast</figcaption>
        </figure>
        <figure class="gallery-item" id="photo-9" tabindex="0">
          <img src="images/gallery-9.jpg" alt="Panoramic view of Bozzhyra Valley in Mangystau">
          <figcaption>Bozzhyra Panorama</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">Advanced CSS Assignment · Berdibek Meiirbek</div>
    </footer>
  </div>
</body>
</html>
